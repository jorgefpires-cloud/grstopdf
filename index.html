<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRS → PDF</title><link rel="stylesheet" href="./app.css"></head>
<body><main><div class="eyebrow">STANDALONE • BROWSER ONLY</div><h1>GRS → PDF</h1>
<p>Your GRS file stays on your device.</p>
<div id="drop" class="drop" tabindex="0"><input id="file" type="file" accept=".grs" hidden>
<strong>Drop a .GRS file here</strong><br><small>or click to choose</small></div>
<div class="buttons"><button id="inspect" disabled>Inspect GRS</button><button id="pdf" disabled>Generate test PDF</button></div>
<section><h2>Diagnostics</h2><pre id="output">Waiting for a GRS file…</pre></section>
</main><script type="module" src="./src/main.js"></script></body></html>
